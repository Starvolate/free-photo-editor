name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Outside tools that read the DPI back from our files (exiftool, pdfimages)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl poppler-utils
      - name: Unit tests
        run: npm test
      - name: Size gate (build, then brotli JS + CSS within budget)
        run: npm run size
      - name: Type check the command line and the MCP server
        run: npm run typecheck:agents
      - name: Command line and MCP server as people get them (pack, install into an empty folder, run both)
        run: npm run smoke:agents
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Every browser test (packages/web/e2e/*.e2e.test.ts) in headless Chrome
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo "No Chrome on the runner: the browser tests would be skipped"; exit 1; }
          export CHROME_PATH
          npx vitest run --config packages/web/vitest.e2e.config.ts
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: packages/web/e2e/out
          if-no-files-found: ignore
      - name: Outside tools read the DPI back from the browser's own exports (exiftool, pdfimages)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl poppler-utils
          cd packages/web/e2e/out
          cat x1-jpeg-sampling.txt
          exiftool -G1 -s -XResolution -YResolution -ResolutionUnit -PixelsPerUnitX -PixelsPerUnitY -PixelUnits x1-300.png x1-300.jpg x1-300.tif
          pdfimages -list x1-300.pdf
          exiftool -s -s -s -PixelsPerUnitX x1-300.png | grep -qx 11811
          exiftool -s -s -s -JFIF:XResolution x1-300.jpg | grep -qx 300
          exiftool -s -s -s -IFD0:XResolution x1-300.jpg | grep -qx 300
          exiftool -s -s -s -IFD0:XResolution x1-300.tif | grep -qx 300
          pdfimages -list x1-300.pdf | awk '$3 == "image" { print $13, $14 }' | grep -qx '300 300'
          echo "Outside readback OK: PNG, JPEG, TIFF and PDF from the browser all say 300 DPI"

